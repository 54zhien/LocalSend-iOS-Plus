name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Xcode 26, simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "Xcode 26 missing, using $latest"
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Verify string catalog
        run: |
          node tools/gen_strings.mjs
          git diff --exit-code Resources/Localizable.xcstrings

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalSendPlus.xcodeproj \
            -scheme LocalSendPlus \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || xcodebuild \
            -project LocalSendPlus.xcodeproj \
            -scheme LocalSendPlus \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

  package:
    name: Package (unsigned device build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "Xcode 26 missing, using $latest"
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Unsigned on purpose: re-sign with your own certificate (Sideloadly, ESign, Xcode).
      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalSendPlus.xcodeproj \
            -scheme LocalSendPlus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/LocalSendPlus.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LocalSendPlus-unsigned.ipa Payload
          ditto -c -k --sequesterRsrc --keepParent "$APP" LocalSendPlus-unsigned-app.zip
          ls -lh LocalSendPlus-unsigned.ipa LocalSendPlus-unsigned-app.zip

      # Variant without the embedded share extension. Enterprise and free-personal
      # signing tools routinely choke on the .appex (its own App ID and, for the App
      # Group, its own capability), which surfaces as a failed install that leaves a
      # grey waiting icon on the home screen.
      - name: Package lite (no share extension)
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/LocalSendPlus.app
          rm -rf Lite
          mkdir -p Lite/Payload
          cp -R "$APP" Lite/Payload/
          rm -rf Lite/Payload/LocalSendPlus.app/PlugIns
          # The archive root MUST be Payload/ - anything else and every signing
          # tool (and installd) reports a missing Info.plist.
          ( cd Lite && zip -qry ../LocalSendPlus-lite.ipa Payload )
          ditto -c -k --sequesterRsrc --keepParent Lite/Payload/LocalSendPlus.app LocalSendPlus-lite-app.zip
          unzip -Z1 LocalSendPlus-lite.ipa | head -3
          ls -lh LocalSendPlus-lite.ipa LocalSendPlus-lite-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LocalSendPlus-unsigned
          path: |
            LocalSendPlus-unsigned.ipa
            LocalSendPlus-unsigned-app.zip
            LocalSendPlus-lite.ipa
            LocalSendPlus-lite-app.zip
          if-no-files-found: error
