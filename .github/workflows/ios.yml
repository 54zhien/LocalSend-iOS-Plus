name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Xcode 26, simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "Xcode 26 missing, using $latest"
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Verify string catalog
        run: |
          node tools/gen_strings.mjs
          git diff --exit-code Resources/Localizable.xcstrings

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalSendNative.xcodeproj \
            -scheme LocalSendNative \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || xcodebuild \
            -project LocalSendNative.xcodeproj \
            -scheme LocalSendNative \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
