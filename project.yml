name: LocalSendNative
options:
  bundleIdPrefix: org.localsend
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  LocalSendNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: LocalSend
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: LocalSend finds nearby devices on your local network to send and receive files.
        NSPhotoLibraryAddUsageDescription: LocalSend saves received photos to your library when you ask it to.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Stage 1 talks plain HTTP to LocalSend peers on the LAN (the protocol allows http or
        # https; this build advertises http). Tighten this once the TLS/pinning layer lands.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.localsend.native
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
