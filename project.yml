name: LocalSendPlus
options:
  bundleIdPrefix: com.imzhien
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  LocalSendPlus:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "i18n"
          - "Info.plist"
          - "LocalSendPlus.entitlements"
          - "LocalSendPlus.icon"
      - path: Resources/LocalSendPlus.icon
        type: file
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: LocalSend+
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: LocalSend Plus finds nearby devices on your local network to send and receive files.
        NSPhotoLibraryAddUsageDescription: LocalSend Plus saves received photos to your library when you ask it to.
        NSCameraUsageDescription: LocalSend Plus uses the camera only to scan a pairing QR code from another device.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.imzhien.localsendplus
            CFBundleURLSchemes:
              - localsendplus
    entitlements:
      path: Resources/LocalSendPlus.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.imzhien.localsendplus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imzhien.localsendplus
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: LocalSendPlus
    dependencies:
      - target: ShareExtension

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Sources/Core/ShareInbox.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: LocalSend+
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 30
              NSExtensionActivationSupportsImageWithMaxCount: 30
              NSExtensionActivationSupportsMovieWithMaxCount: 30
              NSExtensionActivationSupportsText: false
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.imzhien.localsendplus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imzhien.localsendplus.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        SKIP_INSTALL: YES
